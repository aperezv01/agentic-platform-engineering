apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  context: |
    clusterName: aks-ape-demo
    resourceGroup: rg-ape-demo

  service.webhook.github-webhook: |
    url: https://api.github.com/repos/aperezv01/agentic-platform-engineering/dispatches
    headers:
    - name: Accept
      value: application/vnd.github+json
    - name: Authorization
      value: Bearer $github-token
    - name: X-GitHub-Api-Version
      value: "2022-11-28"
    - name: Content-Type
      value: application/json

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [sync-failed-webhook]
    - when: app.status.conditions != nil && app.status.conditions[0].type == 'ComparisonError'
      send: [sync-failed-webhook]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [sync-failed-webhook]

  # GitHub caps client_payload at 10 properties (HTTP 422 beyond that), so this
  # template carries exactly the 10 fields argocd-deployment-failure.yml reads.
  template.sync-failed-webhook: |
    webhook:
      github-webhook:
        method: POST
        body: |
          {
            "event_type": "argocd-sync-failed",
            "client_payload": {
              "app_name": "{{.app.metadata.name}}",
              "cluster": "{{.context.clusterName}}",
              "resource_group": "{{.context.resourceGroup}}",
              "namespace": "{{.app.spec.destination.namespace}}",
              "sync_status": "{{.app.status.sync.status}}",
              "health_status": "{{.app.status.health.status}}",
              "message": "{{.app.status.operationState.message}}",
              "revision": "{{.app.status.sync.revision}}",
              "repo_url": "{{.app.spec.source.repoURL}}",
              "timestamp": "{{.app.status.operationState.finishedAt}}"
            }
          }
